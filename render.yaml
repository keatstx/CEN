# Live URL: https://cen-48pm.onrender.com
# Render assigns a unique hash suffix (-48pm) to the service name; the
# raw `cen.onrender.com` host is NOT this service. Smoke-test the URL
# above after every deploy.
#
# LLM: production runs Groq's free tier via the OpenAI-compatible
# `api` backend. NOTE: Groq retires models on a published schedule --
# llama-3.3-70b-versatile (the previous value) was shut down
# 2026-08-16 and every call silently degraded to the mock until the
# model was swapped. `/ready` now reports llm_available=false when the
# configured model is missing from the provider's /models list, so a
# retirement shows up as a red health check instead of canned text.
# CEN_LLM_MODEL is an ordered preference list: the first model the
# provider still offers wins, resolved at first use and re-resolved
# after a failure. 20b leads because the concierge is an interactive
# chat rail (~2x the throughput of 120b) and answers are grounded in
# retrieved chunks, so model size buys little; 120b is the step-down.
# Both are Apache 2.0 open-weights. Flip the order if generated appeal
# letters come back weak -- it is one env var, no redeploy of logic.
#
# Check https://console.groq.com/docs/deprecations before deploys. Set CEN_LLM_API_KEY in the Render dashboard (Secrets) —
# it's `sync: false` so it's never committed. The deployment_mode
# stays `synthetic` (default), which means the BAA gate is bypassed:
# the api backend is safe here ONLY because no real PHI lives in this
# deployment. Flipping deployment_mode=production would require
# CEN_LLM_BAA_CONFIRMED=true (i.e., a real BAA with Groq) — see
# src/cen/api/app.py _enforce_deployment_mode.

services:
  - type: web
    name: cen
    runtime: docker
    plan: free
    envVars:
      - key: CEN_LLM_BACKEND
        value: api
      - key: CEN_LLM_API_BASE
        value: https://api.groq.com/openai/v1
      - key: CEN_LLM_MODEL
        value: openai/gpt-oss-20b,openai/gpt-oss-120b
      - key: CEN_LLM_API_KEY
        sync: false           # set in Render dashboard (Secret)
      - key: CEN_DB_PATH
        value: /tmp/cen.db
